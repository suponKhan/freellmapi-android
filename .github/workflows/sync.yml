name: Sync with upstream

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    name: Sync from suponKhan/freellmapi
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Add upstream remote
      run: git remote add upstream https://github.com/suponKhan/freellmapi.git
      
    - name: Fetch upstream
      run: git fetch upstream --prune
      
    - name: Check for updates
      id: check
      run: |
        UPSTREAM_SHA=$(git rev-parse upstream/main)
        LOCAL_SHA=$(git rev-parse origin/main)
        echo "upstream=$UPSTREAM_SHA" >> $GITHUB_OUTPUT
        echo "local=$LOCAL_SHA" >> $GITHUB_OUTPUT
        if [ "$UPSTREAM_SHA" != "$LOCAL_SHA" ]; then
          echo "has_updates=true" >> $GITHUB_OUTPUT
        else
          echo "has_updates=false" >> $GITHUB_OUTPUT
        fi
        
    - name: Sync if needed
      if: steps.check.outputs.has_updates == 'true'
      run: |
        git merge upstream/main --no-edit || true
        # Keep our Android-specific files
        git checkout --theirs android/ || true
        git checkout --theirs .github/workflows/release.yml || true
        git add -A
        git commit -m "chore: sync with upstream freellmapi $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "No changes to commit"
        
    - name: Push sync
      if: steps.check.outputs.has_updates == 'true'
      run: git push origin main
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}