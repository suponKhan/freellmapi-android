name: Build Android APKs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: List files
      run: find . -type f -name "*.kt" -o -name "*.xml" -o -name "*.gradle*" | head -30
      
    - name: Build with Gradle
      run: |
        export ANDROID_HOME=/usr/local/lib/android/sdk
        chmod +x ./gradlew
        ./gradlew assembleDebug
      env:
        TERM: dumb