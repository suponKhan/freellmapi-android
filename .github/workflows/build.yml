name: Build Android APKs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build APKs (32-bit + 64-bit)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Download nodejs-mobile binaries & headers
      run: |
        echo "Downloading nodejs-mobile v18.20.4..."
        curl -fsSL -o nodejs-mobile.zip "https://github.com/nodejs-mobile/nodejs-mobile/releases/download/v18.20.4/nodejs-mobile-v18.20.4-android.zip"
        unzip -q nodejs-mobile.zip -d nodejs-mobile-tmp
        mkdir -p android/app/libnode/bin/arm64-v8a
        mkdir -p android/app/libnode/bin/armeabi-v7a
        mkdir -p android/app/libnode/bin/x86_64
        cp nodejs-mobile-tmp/bin/arm64-v8a/libnode.so android/app/libnode/bin/arm64-v8a/
        cp nodejs-mobile-tmp/bin/armeabi-v7a/libnode.so android/app/libnode/bin/armeabi-v7a/
        cp nodejs-mobile-tmp/bin/x86_64/libnode.so android/app/libnode/bin/x86_64/
        cp -r nodejs-mobile-tmp/include android/app/libnode/
        rm -rf nodejs-mobile.zip nodejs-mobile-tmp
        echo "nodejs-mobile installed successfully"
        ls -la android/app/libnode/bin/

    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew

    - name: Build Debug APKs
      run: ./gradlew assembleDebug --stacktrace
      env:
        TERM: dumb

    - name: List generated APKs
      run: |
        echo "=== Generated APKs ==="
        find android/app/build/outputs/apk/ -name "*.apk" -exec ls -lh {} +

    - name: Upload Debug APKs
      uses: actions/upload-artifact@v4
      with:
        name: freellmapi-apks
        path: android/app/build/outputs/apk/debug/*.apk
        retention-days: 30