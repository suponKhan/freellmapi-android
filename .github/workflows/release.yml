name: Release APKs

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  build:
    name: Build Release APKs
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Download nodejs-mobile
      run: |
        echo "Downloading nodejs-mobile v18.20.4..."
        curl -L -o nodejs-mobile.zip "https://github.com/nodejs-mobile/nodejs-mobile/releases/download/v18.20.4/nodejs-mobile-v18.20.4-android.zip"
        echo "Downloaded: $(ls -lh nodejs-mobile.zip)"
        unzip -q nodejs-mobile.zip -d nodejs-mobile-tmp
        echo "Extracted to nodejs-mobile-tmp"
        
    - name: Copy native libraries
      run: |
        mkdir -p android/app/libnode/bin/arm64-v8a
        mkdir -p android/app/libnode/bin/armeabi-v7a
        mkdir -p android/app/libnode/bin/x86_64
        cp nodejs-mobile-tmp/bin/arm64-v8a/libnode.so android/app/libnode/bin/arm64-v8a/
        cp nodejs-mobile-tmp/bin/armeabi-v7a/libnode.so android/app/libnode/bin/armeabi-v7a/
        cp nodejs-mobile-tmp/bin/x86_64/libnode.so android/app/libnode/bin/x86_64/
        cp -r nodejs-mobile-tmp/include android/app/libnode/
        rm -rf nodejs-mobile.zip nodejs-mobile-tmp
        echo "Native libraries installed"
        
    - name: Make gradlew executable
      run: chmod +x ./gradlew
      
    - name: Create local.properties
      run: |
        echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
        
    - name: Build Release APKs
      run: ./gradlew assembleRelease
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
        TERM: dumb
        
    - name: Rename APKs with version
      run: |
        TAG=${{ github.event.inputs.tag_name || github.ref_name }}
        mkdir -p release-apks
        for apk in android/app/build/outputs/apk/release/*.apk; do
          cp "$apk" "release-apks/FreeLLMAPI-${TAG}-$(basename $apk).apk"
        done
        ls -la release-apks/
        
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
        name: "FreeLLMAPI ${{ github.event.inputs.tag_name || github.ref_name }}"
        body: |
          ## FreeLLMAPI Android Release
        
          OpenAI-compatible LLM router for Android (32-bit + 64-bit)
        
          ### Features
          - Foreground service keeps router alive 24/7
          - Auto-start on boot
          - Works on mobile data, WiFi, or local network
          - 6+ free LLM providers (keyless + optional API keys)
        
          ### Usage
          1. Install APK on Android device
          2. Grant notification permission
          3. Tap "Start Router"
          4. Use in your apps:
             - base_url: http://localhost:3001/v1
             - api_key: freellmapi
        
          ### Endpoints
          - Chat: http://localhost:3001/v1/chat/completions
          - Models: http://localhost:3001/v1/models
          - Dashboard: http://localhost:3001/
        files: release-apks/*.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}